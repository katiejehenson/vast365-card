<style>
/* Layout: a single phone-width contact card, navy gradient hero over a white body, QR for scanning at the booth */
:root {
  --turq: #3EE7C6; --turq-2: #7CE9E5; --pale: #B1E9F3; --navy: #2B4A6F;
  --navy-deep: #1C3350; --ink: #22344B; --muted: #5B6F86; --line: #DCEFF3;
  --page: #EAF6F8; --surface: #FFFFFF;
  --font: "Raleway", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 28px 40px; min-height: 100%; }
.card { max-width: 400px; margin: 0 auto; background: var(--surface); border-radius: 22px; overflow: hidden;
  box-shadow: 0 18px 48px -18px rgba(43,74,111,.35); }
.hero { background: linear-gradient(150deg, var(--navy) 0%, var(--navy-deep) 70%); color: #fff;
  padding: 26px 24px 30px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(62,231,198,.35), rgba(124,233,229,0) 70%); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.wordmark { font-weight: 800; font-size: 22px; letter-spacing: .04em; }
.wordmark span { color: var(--turq); }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--navy-deep);
  background: var(--turq); padding: 5px 10px; border-radius: 999px; }
.who { margin-top: 34px; position: relative; z-index: 1; }
h1 { margin: 0; font-size: 32px; font-weight: 800; line-height: 1.1; text-wrap: balance; }
.role { margin-top: 6px; font-size: 15px; font-weight: 600; color: var(--turq-2); letter-spacing: .02em; }
.tag { margin-top: 14px; font-size: 13px; color: var(--pale); letter-spacing: .02em; }
.body { padding: 22px 24px 26px; display: grid; gap: 20px; }
.row { display: grid; gap: 4px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.line { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.val { font-size: 17px; font-weight: 600; color: var(--navy); text-decoration: none; word-break: break-all; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 12.5px; font-weight: 600; color: var(--navy); background: rgba(62,231,198,.14);
  border: 1px solid rgba(62,231,198,.55); padding: 6px 12px; border-radius: 999px; }
.qr { display: grid; justify-items: center; gap: 10px; padding: 18px; border: 2px solid var(--turq); border-radius: 16px;
  background: linear-gradient(180deg, rgba(177,233,243,.25), rgba(255,255,255,0)); }
.qr img { width: 200px; max-width: 100%; height: auto; display: block; }
.qr p { margin: 0; font-size: 13px; font-weight: 600; color: var(--navy); text-align: center; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 140px; display: inline-flex; justify-content: center; align-items: center; min-height: 46px;
  border-radius: 12px; font: 700 14px var(--font); letter-spacing: .02em; text-decoration: none; cursor: pointer;
  border: 2px solid var(--turq); color: var(--navy); background: var(--surface); }
.btn.primary { background: var(--turq); color: var(--navy-deep); }
.btn:hover { filter: brightness(.96); }
.btn:focus-visible, a:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
.copy { font: 700 12px var(--font); color: var(--navy); background: rgba(62,231,198,.18); border: 0;
  padding: 6px 10px; border-radius: 8px; cursor: pointer; }
footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; letter-spacing: .04em; }
</style>

</head>
